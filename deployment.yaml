
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
  labels:
    app: online-bookstore
spec:
  replicas: 3

  selector:
    matchLabels:
      app: online-bookstore

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: online-bookstore

    spec:
      containers:
        - name: online-bookstore
          image: fardinfaruq/online-bookstore:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: online-bookstore-service
spec:
  type: NodePort

  selector:
    app: online-bookstore

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
      protocol: TCP

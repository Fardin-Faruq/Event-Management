<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Bookstore</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #222; }
    header { background: #243b55; color: white; padding: 22px; text-align: center; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #bbb; }
    button { background: #243b55; color: white; cursor: pointer; }
    button:hover { background: #141e30; }
    .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .book, .panel { background: white; padding: 16px; border-radius: 9px; box-shadow: 0 2px 7px #ddd; }
    .book h3 { margin-bottom: 8px; }
    .price { color: #167347; font-weight: bold; }
    .available { color: green; }
    .unavailable { color: crimson; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
<header>
  <h1>Online Bookstore</h1>
  <p>Discover your next favourite book!</p>
</header>

<main>
  <h2>Browse Books</h2>
  <input id="search" placeholder="Search by title or author..." oninput="renderBooks()">
  <select id="category" onchange="renderBooks()">
    <option value="All">All Categories</option>
    <option>Programming</option>
    <option>Fiction</option>
    <option>Science</option>
    <option>Business</option>
  </select>

  <div class="books" id="books"></div>

  <section class="panel">
    <h2>Shopping Cart</h2>
    <div id="cart">Your cart is empty.</div>
    <p id="total">Total: ₹0</p>
    <button onclick="placeOrder()">Place Order</button>
    <p id="orderStatus">No orders placed yet.</p>
    <input id="trackId" placeholder="Enter order ID">
    <button onclick="trackOrder()">Track Order</button>
    <p id="tracking"></p>
  </section>

  <section class="panel">
    <h2>Customer Rating Summary</h2>
    <p>Average rating: ⭐ 4.7/5</p>
    <p>Customer satisfaction: 94%</p>
  </section>
</main>

<footer>Online Bookstore | Automated CI/CD Deployment</footer>

<script>
const books = [
  {id:1,title:"Clean Code",author:"Robert C. Martin",category:"Programming",price:650,stock:8},
  {id:2,title:"The Pragmatic Programmer",author:"Andrew Hunt",category:"Programming",price:720,stock:5},
  {id:3,title:"The Alchemist",author:"Paulo Coelho",category:"Fiction",price:350,stock:10},
  {id:4,title:"1984",author:"George Orwell",category:"Fiction",price:300,stock:0},
  {id:5,title:"A Brief History of Time",author:"Stephen Hawking",category:"Science",price:450,stock:4},
  {id:6,title:"Atomic Habits",author:"James Clear",category:"Business",price:500,stock:7}
];

let cart = [];
let orders = [];
let nextOrderId = 1001;

function renderBooks() {
  const q = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;
  const filtered = books.filter(b =>
    (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) &&
    (category === "All" || b.category === category)
  );

  document.getElementById("books").innerHTML = filtered.map(b => `
    <div class="book">
      <h3>${b.title}</h3>
      <p>Author: ${b.author}</p>
      <p>Category: ${b.category}</p>
      <p class="price">₹${b.price}</p>
      <p class="${b.stock ? 'available' : 'unavailable'}">
        ${b.stock ? 'Available: ' + b.stock : 'Out of stock'}
      </p>
      <button onclick="addToCart(${b.id})" ${b.stock ? '' : 'disabled'}>
        Add to Cart
      </button>
    </div>
  `).join("") || "<p>No books found.</p>";
}

function addToCart(id) {
  const book = books.find(b => b.id === id);
  const count = cart.filter(b => b.id === id).length;
  if (!book || count >= book.stock) {
    alert("No more copies available.");
    return;
  }
  cart.push(book);
  renderCart();
}

function renderCart() {
  const total = cart.reduce((sum, b) => sum + b.price, 0);
  document.getElementById("cart").innerHTML = cart.length
    ? cart.map(b => `${b.title} — ₹${b.price}`).join("<br>")
    : "Your cart is empty.";
  document.getElementById("total").textContent = "Total: ₹" + total;
}

function placeOrder() {
  if (!cart.length) {
    alert("Please add a book before placing an order.");
    return;
  }

  const order = {
    id: nextOrderId++,
    items: [...cart],
    status: "Confirmed"
  };

  orders.push(order);
  cart = [];
  renderCart();

  document.getElementById("orderStatus").textContent =
    `Order #${order.id} placed successfully!`;
}

function trackOrder() {
  const id = Number(document.getElementById("trackId").value);
  const order = orders.find(o => o.id === id);
  document.getElementById("tracking").textContent = order
    ? `Order #${order.id}: ${order.status}`
    : "Order not found. Enter an order ID from this session.";
}

renderBooks();
renderCart();
</script>
</body>
</html>
